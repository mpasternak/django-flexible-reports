[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-flexible-reports"
version = "0.4.0"
description = "A framework for report generation in Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Michał Pasternak", email = "michal.dtz@gmail.com"}]
keywords = [
    "django",
    "reports",
    "reporting",
    "django-tables2",
    "admin",
    "djangoql",
    "export",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=5.2",
    "django-dsl>=0.1.12",
    "djangoql-iplweb>=0.20",
    "django-tables2>=1.16.0",
    "tablib>=0.11.5",
    "lxml>=3.8.0",
    "pypandoc>=1.4",
    "bleach>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
]
lint = [
    # Pinned exactly, and kept in lock-step with the ``rev`` of
    # astral-sh/ruff-pre-commit in .pre-commit-config.yaml. Without a pin here
    # `uv run ruff` in CI silently auto-provisions whatever ruff is newest,
    # so the hook and the workflow would drift apart and disagree about
    # formatting.
    "ruff==0.15.22",
]
test = [
    "coverage",
    "pytest",
    "pytest-django",
    "pytest-cov",
    "html5lib<=0.9999999",
    "beautifulsoup4>=4.11.1",
    "model-bakery",
    "psycopg2-binary",
]

[project.urls]
Homepage = "https://github.com/mpasternak/django-flexible-reports"
Documentation = "https://mpasternak.github.io/django-flexible-reports/"
Repository = "https://github.com/mpasternak/django-flexible-reports"
Issues = "https://github.com/mpasternak/django-flexible-reports/issues"
Changelog = "https://github.com/mpasternak/django-flexible-reports/blob/master/HISTORY.md"

[tool.setuptools.packages.find]
include = ["flexible_reports*"]

[tool.setuptools.package-data]
flexible_reports = [
    "templates/**/*",
    "static/**/*",
    "locale/**/*",
]

[tool.bumpversion]
current_version = "0.4.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "flexible_reports/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.pytest.ini_options]
addopts = "-s --ds=tests.settings"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = [
    "*site-packages*",
    "*tests*",
    "*.tox*",
]
show_missing = true
exclude_lines = [
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
# Migrations are autogenerated; their style is not worth linting.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W"]
