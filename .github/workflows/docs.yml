name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets the maintainer re-publish without pushing a commit.
  workflow_dispatch:

# Read-only by default; the deploy job asks for more.
permissions:
  contents: read

# One deployment at a time. In-progress runs are *not* cancelled: cancelling a
# half-finished deployment can leave Pages in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        # MkDocs, the Material theme and pymdown-extensions only. The manual is
        # prose: it imports nothing from this package, so Django is not needed
        # and the docs build stays independent of pyproject.toml.
        run: pip install -r docs/requirements.txt

      - name: Build the documentation
        # --strict: any MkDocs warning fails the build, so a broken
        # cross-reference or a missing page is caught in the pull request.
        # (This is what -W did for the old Sphinx build.)
        run: mkdocs build --strict

      - name: Upload the Pages artifact
        # Only the push to master needs an artifact; on pull requests the
        # build above is the whole point.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Never deploy from a pull request -- a fork could otherwise publish to
    # the project's site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write       # to deploy to Pages
      id-token: write    # to let deploy-pages verify the artifact's origin

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages is already enabled on the repository by hand. Leaving this
          # at the default would make the action try to enable it through the
          # API, which needs a token this workflow does not have.
          enablement: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
