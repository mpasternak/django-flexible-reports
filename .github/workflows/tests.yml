name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  POSTGRES_HOST: localhost
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.0"]
        exclude:
          # Django 6.0 requires Python 3.12+
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get install -y gettext pandoc

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "Django>=${{ matrix.django-version }},<${{ matrix.django-version }}.99"

      # --no-sync is load-bearing: `uv run` re-syncs the environment from the
      # lockfile by default, which silently uninstalls the Django pinned just
      # above and reinstalls the locked one. Without it every leg of the matrix
      # tests the same Django version while reporting the matrix one.
      - name: Verify the pinned Django is the one under test
        run: |
          uv run --no-sync python -c "import django; print(django.__version__)"
          uv run --no-sync python -c "
          import django, sys
          want = '${{ matrix.django-version }}'
          got = '.'.join(django.__version__.split('.')[:2])
          sys.exit(0 if got == want else f'expected Django {want}, got {django.__version__}')
          "

      - name: Run tests
        run: uv run --no-sync pytest --cov=flexible_reports

      # django-grappelli is deliberately NOT a declared dependency: the suite
      # has to pass without it (the grappelli tests skip themselves). Its
      # change_form.html shadows Django's, so the Clone button needs a run of
      # its own with grappelli overlaid on the synced environment.
      - name: Run grappelli integration tests
        run: uv run --no-sync --with django-grappelli pytest test_app/tests/test_admin/test_grappelli.py

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      # ruff is pinned in the `lint` extra (installed by the sync above) and
      # kept in lock-step with .pre-commit-config.yaml. Do not add `--with
      # ruff` or drop the pin: `uv run ruff` would then auto-provision the
      # newest release and CI would lint with a different ruff than the hook.
      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .
